<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOKA oyunları</title>
<meta name="description" content="MOKA mini oyunları: Xətti tut, Dən yağışı, Hərf yaddaşı. Oyna, MOKA Club xalı topla.">
<meta name="theme-color" content="#1B1714">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500&family=Montserrat:wght@500&family=Mulish:wght@400;700&display=swap">
<link rel="stylesheet" href="../ar/shared/ui.css">
<style>
  body{min-height:100svh}
  .wrap{max-width:1100px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px))}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  header.hero{display:grid;gap:16px;margin:44px 0 30px}
  header.hero .wm{width:150px}
  header.hero .line{height:4px;background:var(--paper);max-width:520px}
  header.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.04}
  header.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:56ch;font-size:17px}
  .grid{display:grid;gap:14px}
  @media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
  .g{display:flex;flex-direction:column;text-decoration:none;border:1.5px solid rgba(245,241,234,.15);overflow:hidden;transition:border-color .3s,transform .5s cubic-bezier(.2,.8,.2,1)}
  .g:hover{border-color:var(--glow);transform:translateY(-4px)}
  .g .art{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center}
  .g .art svg{height:78%;width:auto}
  .g .tx{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
  .g h2{font-size:26px}
  .g p{margin:0;color:var(--muted);font-size:15px;line-height:1.5;flex:1}
  .g .meta{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .g .meta b{color:var(--glow)}
  .club{margin-top:18px;display:grid;gap:16px;align-items:center;border:1.5px solid rgba(255,226,166,.4);padding:20px;background:linear-gradient(120deg,rgba(255,226,166,.08),transparent 60%)}
  @media(min-width:760px){.club{grid-template-columns:1fr auto}}
  .club h2{font-size:28px}
  .club p{margin:6px 0 0;color:var(--muted);line-height:1.55}
  .club .pts{font-family:var(--display);font-size:48px;line-height:1;color:var(--glow)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="back" data-home href="../"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-t="back"></span></a>
    <div class="langs" role="group" aria-label="Language"><button type="button" data-lang="az">AZ</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button></div>
  </div>
  <header class="hero">
    <span id="wm"></span>
    <div class="line"></div>
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
  </header>
  <div class="grid">
    <a class="g" data-hub="./line/" href="./line/">
      <div class="art" style="background:#C89B6D"><svg viewBox="0 0 120 100" aria-hidden="true"><polygon points="45,4 75,4 66,22 54,22" fill="#F5F1EA"/><rect x="58" y="22" width="4" height="34" fill="#5E3B26"/><path d="M34,40 L86,40 L80,96 L40,96 Z" fill="none" stroke="#1B1714" stroke-width="4"/><path d="M38,64 L82,64 L79,94 L41,94 Z" fill="#5E3B26"/><rect x="24" y="62" width="72" height="3" fill="#F5F1EA"/></svg></div>
      <div class="tx"><h2 data-t="g1"></h2><p data-t="g1p"></p><div class="meta"><span data-t="best"></span><b id="b-line">—</b></div></div>
    </a>
    <a class="g" data-hub="./rain/" href="./rain/">
      <div class="art" style="background:#D9B56A"><svg viewBox="0 0 120 100" aria-hidden="true"><g fill="#5E3B26"><ellipse cx="30" cy="20" rx="6" ry="9" transform="rotate(20 30 20)"/><ellipse cx="62" cy="12" rx="6" ry="9" transform="rotate(-15 62 12)"/><ellipse cx="90" cy="34" rx="6" ry="9" transform="rotate(35 90 34)"/></g><ellipse cx="48" cy="44" rx="6" ry="9" fill="#FFE2A6" transform="rotate(-25 48 44)"/><ellipse cx="78" cy="58" rx="6" ry="9" fill="#8C9A5B"/><path d="M38,66 L82,66 L77,98 L43,98 Z" fill="#F5F1EA"/><rect x="40" y="74" width="40" height="11" fill="#1B1714"/><rect x="40" y="79" width="40" height="2" fill="#FFE2A6"/></svg></div>
      <div class="tx"><span class="eyebrow" style="color:var(--esp);background:var(--glow);align-self:flex-start;padding:3px 7px" data-t="new"></span><h2 data-t="g2"></h2><p data-t="g2p"></p><div class="meta"><span data-t="best"></span><b id="b-rain">—</b></div></div>
    </a>
    <a class="g" data-hub="./memory/" href="./memory/">
      <div class="art" style="background:#A8643A"><svg viewBox="0 0 120 100" aria-hidden="true"><rect x="14" y="14" width="26" height="34" fill="#F5F1EA"/><rect x="47" y="14" width="26" height="34" fill="#26211D"/><rect x="80" y="14" width="26" height="34" fill="#26211D"/><rect x="14" y="54" width="26" height="34" fill="#26211D"/><rect x="47" y="54" width="26" height="34" fill="#F5F1EA"/><rect x="80" y="54" width="26" height="34" fill="#26211D"/><polygon points="21,40 27,24 33,40" fill="#1B1714"/><path d="M54,64h12l-4,8 4,8H54l4-8z" fill="#1B1714"/><g fill="#FFE2A6"><rect x="47" y="30" width="26" height="2"/><rect x="80" y="30" width="26" height="2"/><rect x="14" y="70" width="26" height="2"/><rect x="80" y="70" width="26" height="2"/></g></svg></div>
      <div class="tx"><span class="eyebrow" style="color:var(--esp);background:var(--glow);align-self:flex-start;padding:3px 7px" data-t="new"></span><h2 data-t="g3"></h2><p data-t="g3p"></p><div class="meta"><span data-t="best"></span><b id="b-memory">—</b></div></div>
    </a>
  </div>
  <a class="club" data-hub="../club/" href="../club/" style="text-decoration:none">
    <div><p class="eyebrow" style="margin:0">MOKA Club</p><h2 data-t="clubT"></h2><p data-t="clubP"></p></div>
    <div style="text-align:right"><span class="pts" id="pts">0</span><br><span class="eyebrow" style="color:var(--muted)" data-t="ptsL"></span></div>
  </a>
</div>
<script src="../club/club.js"></script>
<script type="module">
import { initLang, WORDMARK_SVG } from '../ar/shared/lang.js';
document.getElementById('wm').innerHTML = WORDMARK_SVG;
const T = {
  az: { back: 'Sayta qayıt', eyebrow: 'Mini oyunlar · brauzerdə', title: 'Oyna, xal topla', lead: 'Üç qısa oyun, hər biri brendin bir fikri üzərində: imza xətti, Bakıda bir gün və dörd hərf. Hər oyun MOKA Club xalı qazandırır.',
    g1: 'Xətti tut', g1p: 'Basıb saxla, qəhvə tökülsün. Fincanı düz imza xəttinə qədər doldur. 5 raund, qovurma tündləşir.',
    g2: 'Dən yağışı', g2p: '45 saniyəlik Bakı günü. Stəkanla qovrulmuş və qızıl dənləri tut, yaşıllardan qaç.',
    g3: 'Hərf yaddaşı', g3p: '16 kart: hərfi aləti ilə, günün rəngini adı ilə cütlə. Hər cüt brendin bir qaydasıdır.',
    best: 'Ən yaxşı', new: 'Yeni', clubT: 'Xal topla, endirim qazan', clubP: 'Oyunlar və AR təcrübələri xal verir; xallar "Dəmləmə pasportu"nu doldurur və endirim kodlarına çevrilir. Konsept demo.', ptsL: 'xal' },
  en: { back: 'Back to site', eyebrow: 'Mini games · in the browser', title: 'Play, collect points', lead: 'Three short games, each built on one idea of the brand: the signature line, a day in Baku and the four letters. Every game earns MOKA Club points.',
    g1: 'Hit the line', g1p: 'Hold to pour. Fill the cup exactly to the signature line. 5 rounds, the roast gets darker.',
    g2: 'Bean rain', g2p: 'A 45-second day in Baku. Catch roasted and golden beans with the cup, dodge the green ones.',
    g3: 'Letter memory', g3p: '16 cards: match each letter with its brewer and each colour with its name. Every pair is a brand rule.',
    best: 'Best', new: 'New', clubT: 'Collect points, earn discounts', clubP: 'Games and AR experiences earn points; points fill the "Brew passport" and turn into discount codes. Concept demo.', ptsL: 'points' },
  ru: { back: 'На сайт', eyebrow: 'Мини-игры · в браузере', title: 'Играйте, копите баллы', lead: 'Три короткие игры, каждая — об одной идее бренда: фирменная линия, день в Баку и четыре буквы. Каждая игра приносит баллы MOKA Club.',
    g1: 'Поймай линию', g1p: 'Удерживайте, чтобы наливать. Наполните чашку ровно до линии. 5 раундов, обжарка темнеет.',
    g2: 'Зерновой дождь', g2p: 'День в Баку за 45 секунд. Ловите стаканом обжаренные и золотые зёрна, избегайте зелёных.',
    g3: 'Память букв', g3p: '16 карт: найдите для буквы её способ, для цвета — название. Каждая пара — правило бренда.',
    best: 'Рекорд', new: 'Новое', clubT: 'Копите баллы, получайте скидки', clubP: 'Игры и AR приносят баллы; баллы заполняют «Паспорт заваривания» и превращаются в коды скидок. Концепт-демо.', ptsL: 'баллов' },
};
initLang(T, { home: '../' });
const get = (k) => { try { return +(localStorage.getItem(k) || 0); } catch (e) { return 0; } };
[['line', 'moka-line-best'], ['rain', 'moka-rain-best'], ['memory', 'moka-memory-best']].forEach(([id, k]) => { const v = get(k); if (v) document.getElementById('b-' + id).textContent = v; });
if (window.MokaClub) document.getElementById('pts').textContent = MokaClub.state().points;
</script>
</body>
</html>
