<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Xətti tut — MOKA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Lato:wght@400;700&display=swap">
<style>
  :root{--esp:#1B1714;--paper:#F5F1EA;--oak:#C89B6D;--bamboo:#D9B56A;--copper:#A8643A;--muted:#B8B0A6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--esp);color:var(--paper);font-family:Lato,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  .app{height:100%;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px}
  header a{color:var(--paper);display:flex}
  header svg{height:18px;width:auto}
  .hud{display:flex;gap:18px;font-weight:700;font-size:13px;letter-spacing:.14em}
  .hud b{color:var(--bamboo);font-variant-numeric:tabular-nums}
  .stage{flex:1;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .msg{position:absolute;left:0;right:0;top:12%;text-align:center;font-family:Jost,Futura,sans-serif;font-size:clamp(28px,8vw,44px);font-weight:600;pointer-events:none;opacity:0;transition:opacity .25s}
  .msg.show{opacity:1}
  .msg small{display:block;font-family:Lato,sans-serif;font-size:15px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-top:6px}
  .hint{text-align:center;font-size:14px;color:var(--muted);letter-spacing:.06em;padding-top:8px}
  .panel{position:absolute;inset:0;z-index:5;background:rgba(27,23,20,.96);display:flex;flex-direction:column;justify-content:center;gap:20px;padding:24px}
  .panel h1{font-family:Jost,Futura,sans-serif;font-weight:500;font-size:clamp(40px,11vw,60px);line-height:1;margin:0}
  .panel p{margin:0;color:var(--muted);line-height:1.55;font-size:16px}
  .panel .line{height:4px;background:var(--paper)}
  .panel button{font:inherit;font-weight:700;letter-spacing:.14em;font-size:15px;background:var(--paper);color:var(--esp);border:0;padding:16px;min-height:52px;cursor:pointer}
  .panel button:focus-visible{outline:3px solid var(--bamboo);outline-offset:3px}
  .panel .big{font-family:Jost,Futura,sans-serif;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
  .panel .rows{display:flex;flex-direction:column;gap:6px;font-size:15px}
  .panel .rows div{display:flex;justify-content:space-between;border-bottom:1px solid #3A3530;padding:6px 0;font-variant-numeric:tabular-nums}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header>
    <a href="../" aria-label="MOKA brend saytına qayıt">
      <svg viewBox="0 0 675 155" aria-hidden="true"><defs><clipPath id="s"><rect x="0" y="0" width="675" height="74.5"/><rect x="0" y="79.5" width="675" height="75.5"/></clipPath></defs><g fill="currentColor"><g clip-path="url(#s)"><polygon points="32,4 87,47 145,4 172,149 2,150"/><circle cx="266" cy="77" r="76"/><polygon points="381,7 508,7 467,77 508,149 385,149 407,77"/><polygon points="597,4 671,149 522,149"/></g><path d="M384,20 C364,20 352,36 352,54 C352,74 368,86 386,86 L393,94" fill="none" stroke="currentColor" stroke-width="8"/></g></svg>
    </a>
    <div class="hud"><span>RAUND <b id="round">1/5</b></span><span>XAL <b id="score">0</b></span></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Fincan və qəhvə axını"></canvas>
    <div class="msg" id="msg"></div>
    <div class="panel" id="intro">
      <h1>Xətti tut</h1>
      <div class="line"></div>
      <p>Barmağını ekranda saxla, qəhvə tökülsün. Burax, axın dayansın. Qəhvəni düz imza xəttinə qədər doldur.</p>
      <p>Diqqət: buraxandan sonra bir neçə damla da düşür. Hər raundda axın sürətlənir, qovurma tündləşir.</p>
      <button id="go" type="button">BAŞLA</button>
    </div>
    <div class="panel hidden" id="end">
      <p style="letter-spacing:.2em;font-weight:700;font-size:13px">NƏTİCƏ</p>
      <span class="big" id="total">0</span>
      <p id="verdict"></p>
      <div class="rows" id="rows"></div>
      <p id="best"></p>
      <button id="again" type="button">YENİDƏN</button>
    </div>
  </div>
  <p class="hint" id="hint">Basıb saxla: tök · Burax: dayan</p>
</div>
<script>
(function(){
  var ROUNDS=[
    {name:'Yaşıl dən',color:'#8C9A5B',speed:.22},
    {name:'Açıq qovurma',color:'#C08A55',speed:.27},
    {name:'Orta qovurma',color:'#8A5A3B',speed:.32},
    {name:'Tünd qovurma',color:'#5E3B26',speed:.38},
    {name:'French qovurma',color:'#3B2416',speed:.45}
  ];
  var c=document.getElementById('c'),ctx=c.getContext('2d'),stage=document.getElementById('stage');
  var msg=document.getElementById('msg'),roundEl=document.getElementById('round'),scoreEl=document.getElementById('score');
  var intro=document.getElementById('intro'),end=document.getElementById('end');
  var W=0,H=0,dpr=1;
  var st={r:0,level:0,target:.6,pouring:false,drip:0,phase:'idle',score:0,results:[],t:0};

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=stage.clientWidth;H=stage.clientHeight;
    c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize',resize);resize();

  function cupGeom(){
    var ch=Math.min(H*.62,420),cw=ch*.62;
    var cx=W/2,bottom=H*.94,top=bottom-ch;
    return {cx:cx,top:top,bottom:bottom,tw:cw,bw:cw*.72,h:ch};
  }
  function xAt(g,y){ // half-width of the cup at height y
    var k=(y-g.top)/g.h;return (g.tw+(g.bw-g.tw)*k)/2;
  }
  function startRound(){
    st.level=0;st.drip=0;st.pouring=false;st.phase='ready';
    st.target=.35+Math.random()*.5;
    roundEl.textContent=(st.r+1)+'/5';
    say(ROUNDS[st.r].name,'RAUND '+(st.r+1));
  }
  function say(big,small){
    msg.innerHTML=big+(small?'<small>'+small+'</small>':'');
    msg.classList.add('show');
    clearTimeout(say.t);say.t=setTimeout(function(){msg.classList.remove('show')},1300);
  }
  function down(e){
    if(e)e.preventDefault();
    if(st.phase==='ready'){st.phase='pouring'}
    if(st.phase==='pouring'){st.pouring=true}
  }
  function up(){
    if(st.phase==='pouring'&&st.pouring){
      st.pouring=false;st.phase='settling';st.drip=.03+ROUNDS[st.r].speed*.06;
    }
  }
  stage.addEventListener('pointerdown',function(e){if(e.target===c||e.target===msg)down(e)});
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  window.addEventListener('keydown',function(e){if(e.code==='Space'&&!e.repeat&&intro.classList.contains('hidden')&&end.classList.contains('hidden')){e.preventDefault();down()}});
  window.addEventListener('keyup',function(e){if(e.code==='Space')up()});

  function finishRound(){
    st.phase='done';
    var diff=Math.abs(st.level-st.target)*100,pts,label;
    if(st.level>1){pts=0;label='Daşdı!'}
    else{pts=Math.max(0,Math.round(100-diff*6));label=diff<1.5?'Mükəmməl!':diff<4?'Çox yaxşı':diff<8?'Pis deyil':'Uzaqdır'}
    st.score+=pts;scoreEl.textContent=st.score;
    st.results.push({name:ROUNDS[st.r].name,pts:pts});
    say(label,'+'+pts+' XAL');
    setTimeout(function(){
      st.r++;
      if(st.r<ROUNDS.length)startRound();else showEnd();
    },1500);
  }
  function showEnd(){
    st.phase='idle';
    document.getElementById('total').textContent=st.score+' / 500';
    var v=st.score>=450?'Usta barista. İşə qəbul!':st.score>=350?'Əla əl. Bir az da məşq.':st.score>=200?'Yaxşı başlanğıc.':'Qəhvə səbr sevir. Yenidən cəhd et.';
    document.getElementById('verdict').textContent=v;
    document.getElementById('rows').innerHTML=st.results.map(function(r){return '<div><span>'+r.name+'</span><span>'+r.pts+'</span></div>'}).join('');
    var best=0;try{best=+(localStorage.getItem('moka-line-best')||0);if(st.score>best){best=st.score;localStorage.setItem('moka-line-best',best)}}catch(e){best=Math.max(best,st.score)}
    document.getElementById('best').textContent='Ən yaxşı nəticən: '+best;
    end.classList.remove('hidden');
    document.getElementById('again').focus();
  }
  function newGame(){
    st.r=0;st.score=0;st.results=[];scoreEl.textContent='0';
    intro.classList.add('hidden');end.classList.add('hidden');
    startRound();
  }
  document.getElementById('go').addEventListener('click',newGame);
  document.getElementById('again').addEventListener('click',newGame);

  var last=performance.now();
  function frame(now){
    var dt=Math.min((now-last)/1000,.05);last=now;st.t+=dt;
    var R=ROUNDS[st.r]||ROUNDS[0];
    if(st.phase==='pouring'&&st.pouring){st.level+=R.speed*dt;if(st.level>1.02)up()}
    if(st.phase==='settling'){
      var add=Math.min(st.drip,R.speed*dt*.5);st.level+=add;st.drip-=add;
      if(st.drip<=.0005)finishRound();
    }
    draw(R);
    requestAnimationFrame(frame);
  }
  function draw(R){
    ctx.clearRect(0,0,W,H);
    var g=cupGeom();
    // liquid
    var lv=Math.min(st.level,1.04),ly=g.bottom-g.h*Math.min(lv,1);
    if(lv>0){
      ctx.fillStyle=R.color;ctx.beginPath();
      ctx.moveTo(g.cx-xAt(g,g.bottom),g.bottom);ctx.lineTo(g.cx+xAt(g,g.bottom),g.bottom);
      ctx.lineTo(g.cx+xAt(g,ly),ly);ctx.lineTo(g.cx-xAt(g,ly),ly);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(245,241,234,.18)';ctx.fillRect(g.cx-xAt(g,ly),ly,xAt(g,ly)*2,3);
    }
    // cup outline
    ctx.strokeStyle='#F5F1EA';ctx.lineWidth=5;ctx.lineJoin='round';ctx.beginPath();
    ctx.moveTo(g.cx-g.tw/2,g.top);ctx.lineTo(g.cx-g.bw/2,g.bottom);ctx.lineTo(g.cx+g.bw/2,g.bottom);ctx.lineTo(g.cx+g.tw/2,g.top);ctx.stroke();
    // target: the brand line
    if(st.phase!=='idle'){
      var ty=g.bottom-g.h*st.target,hw=xAt(g,ty)+26;
      ctx.fillStyle='#F5F1EA';ctx.fillRect(g.cx-hw,ty-2,hw*2,4);
      ctx.fillStyle='#D9B56A';ctx.font='700 12px Lato, sans-serif';ctx.textAlign='left';ctx.fillText('XƏTT',g.cx+hw+6,ty+4);
    }
    // Chemex spout above
    var sy=g.top-H*.2,sx=g.cx;
    ctx.fillStyle='#F5F1EA';ctx.beginPath();
    ctx.moveTo(sx-34,sy-56);ctx.lineTo(sx+34,sy-56);ctx.lineTo(sx+10,sy-14);ctx.lineTo(sx-10,sy-14);ctx.closePath();ctx.fill();
    ctx.fillStyle='#C89B6D';ctx.fillRect(sx-14,sy-20,28,10);
    // stream
    if(st.pouring||st.phase==='settling'){
      var w=st.pouring?6:Math.max(1.5,st.drip*90);
      ctx.fillStyle=R.color;ctx.fillRect(sx-w/2,sy-12,w,Math.max(0,ly-sy+12));
    }
    if(st.level>1&&st.phase!=='idle'){
      ctx.fillStyle=R.color;ctx.fillRect(g.cx+g.tw/2-2,g.top,6,g.h*.6);ctx.fillRect(g.cx-g.tw/2-4,g.top,6,g.h*.45);
    }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
