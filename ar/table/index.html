<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOKA AR · Masana qoy</title>
<meta name="theme-color" content="#1B1714">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500&family=Montserrat:wght@500&family=Mulish:wght@400;700&display=swap">
<link rel="stylesheet" href="../shared/ui.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<style>
  body{min-height:100svh;display:flex;flex-direction:column}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;position:relative;z-index:2}
  main{flex:1;display:grid;grid-template-columns:1fr;max-width:1200px;width:100%;margin:0 auto}
  @media(min-width:900px){main{grid-template-columns:1.4fr 1fr;align-items:center;gap:24px;padding:0 24px}}
  model-viewer{width:100%;height:min(62svh,640px);--poster-color:transparent;background:radial-gradient(ellipse at 50% 60%,rgba(242,199,110,.16),transparent 60%)}
  @media(min-width:900px){model-viewer{height:min(80svh,760px)}}
  model-viewer::part(default-progress-bar){background:var(--glow);height:3px}
  .panel{padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
  .panel h1{font-size:clamp(30px,6vw,48px);line-height:1.05}
  .panel p{margin:0;color:var(--muted);line-height:1.55}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .tabs button{font:inherit;font-size:13px;font-weight:700;color:var(--paper);background:transparent;border:1.5px solid rgba(245,241,234,.2);min-height:48px;cursor:pointer;padding:6px}
  .tabs button[aria-selected="true"]{background:var(--paper);color:var(--esp);border-color:var(--paper)}
  .sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .sw button{width:40px;height:40px;border-radius:50%;border:2px solid rgba(245,241,234,.25);cursor:pointer;padding:0}
  .sw button[aria-pressed="true"]{outline:2px solid var(--paper);outline-offset:3px}
  .swl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .arbtn{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .arbtn svg{width:20px;height:20px}
  .hot{background:var(--esp);color:var(--paper);border:1.5px solid var(--glow);font:700 11px Mulish,sans-serif;letter-spacing:.06em;padding:6px 8px;max-width:160px;line-height:1.3;transform:translate(10px,-50%);pointer-events:none;opacity:0;transition:opacity .3s}
  .hot[data-visible]{opacity:1}
  .hot::before{content:"";position:absolute;left:-12px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--glow);transform:translateY(-50%)}
  .noar{font-size:13px;color:var(--muted);border-left:3px solid var(--bamboo);padding:8px 12px;background:rgba(245,241,234,.04)}
  .qr{display:none;gap:14px;align-items:center;font-size:13px;color:var(--muted)}
  .qr img{width:88px;height:88px;background:#fff;padding:5px}
  @media(min-width:900px) and (hover:hover){.qr{display:flex}}
</style>
</head>
<body>
<div class="bar">
  <a class="back" data-hub="../" href="../"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-t="back"></span></a>
  <div class="langs" role="group" aria-label="Language"><button type="button" data-lang="az">AZ</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button></div>
</div>
<main>
  <model-viewer id="mv" src="../models/cup.glb" alt="MOKA"
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
    camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="1500" rotation-per-second="18deg"
    shadow-intensity="1.1" shadow-softness="0.8" exposure="1.05" environment-image="neutral"
    camera-orbit="25deg 75deg auto" interaction-prompt="auto">
    <button slot="ar-button" class="btn arbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z M12 12l9-5 M12 12v10 M12 12L3 7" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-t="ar"></span></button>
    <div slot="hotspot-line" class="hot" id="hot" data-position="0 0.0616 0.038" data-normal="0 0 1" data-visibility-attribute="visible"><span data-t="hot"></span></div>
  </model-viewer>
  <section class="panel">
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="sleeve">
      <div class="swl"><span data-t="sleeve"></span>: <b id="swname" style="color:var(--paper)"></b></div>
      <div class="sw" id="sw" style="margin-top:10px"></div>
    </div>
    <p id="desc"></p>
    <p class="noar hidden" id="noar" data-t="noar"></p>
    <div class="qr"><img src="../qr-table.png" alt="" width="88" height="88"><span data-t="qr"></span></div>
    <small style="color:var(--muted)" data-t="note"></small>
  </section>
</main>
<script type="module">
import { initLang } from '../shared/lang.js';
import { paintSleeve, DAY } from '../shared/moka-art.js';

const MODELS = [
  { id: 'cup', orbit: '25deg 75deg auto' },
  { id: 'chemex', orbit: '20deg 78deg auto' },
  { id: 'bag', orbit: '0deg 80deg auto' },
  { id: 'wordmark', orbit: '0deg 80deg auto' },
];
const T = {
  az: { back: 'AR menyusu', eyebrow: 'AR · Masana qoy', title: 'Real ölçüdə, öz masanda', lead: 'Modeli seç, barmaqla fırlat, sonra "Masana qoy" düyməsinə bas: kamera açılır və obyekt döşəməyə və ya masaya yerləşir.',
    ar: 'Masana qoy', sleeve: 'Qolun rəngi', hot: 'Xətt ölçünü göstərir', noar: 'Bu cihazda AR açılmadı. 3D modeli burada fırlada bilərsən; AR üçün telefonda Safari (iPhone) və ya Chrome (Android) ilə aç.',
    qr: 'AR üçün telefonla skan et.', note: 'Konsept / test işi. Paketdəki mənşə və dad notları yer tutucudur.',
    names: ['Stəkan', 'Chemex', 'Paket', 'Loqo'],
    desc: ['Götür stəkanı, M · 350 ml. Qoldakı xətt ölçünü göstərir; rəng günün saatına görə dəyişir.', 'Şüşə Chemex: qəhvə düz imza xəttinə qədər. K hərfi bu alətdir.', 'Əsas çeşid, orta qovurma. Rəngli hissənin hündürlüyü qovurma səviyyəsidir.', 'Dörd hərf, bir xətt: masaüstü heykəl kimi 3D loqo, işıqlı imza xətti ilə.'] },
  en: { back: 'AR menu', eyebrow: 'AR · On your table', title: 'Real size, on your own table', lead: 'Pick a model, spin it with your finger, then tap "Place on table": the camera opens and the object sits on your floor or desk.',
    ar: 'Place on table', sleeve: 'Sleeve colour', hot: 'The line shows the size', noar: "AR didn't open on this device. You can still spin the 3D model here; for AR open the page in Safari (iPhone) or Chrome (Android).",
    qr: 'Scan with your phone for AR.', note: 'Concept / test project. Origin and tasting notes on the bag are placeholders.',
    names: ['Cup', 'Chemex', 'Bag', 'Logo'],
    desc: ['Takeaway cup, M · 350 ml. The line on the sleeve shows the size; the colour follows the time of day.', 'Glass Chemex: coffee right up to the signature line. The letter K is this brewer.', 'Core range, medium roast. The height of the coloured part is the roast level.', 'Four letters, one line: the 3D logo as a desk sculpture with a glowing signature line.'] },
  ru: { back: 'Меню AR', eyebrow: 'AR · На вашем столе', title: 'В натуральную величину, на вашем столе', lead: 'Выберите модель, поверните пальцем и нажмите «Поставить на стол»: откроется камера, и предмет встанет на пол или стол.',
    ar: 'Поставить на стол', sleeve: 'Цвет манжеты', hot: 'Линия показывает размер', noar: 'AR не запустился на этом устройстве. 3D-модель можно вращать здесь; для AR откройте страницу в Safari (iPhone) или Chrome (Android).',
    qr: 'Отсканируйте телефоном для AR.', note: 'Концепт / тестовый проект. Происхождение и ноты на пачке — заглушки.',
    names: ['Стакан', 'Chemex', 'Пачка', 'Логотип'],
    desc: ['Стакан с собой, M · 350 мл. Линия на манжете показывает размер; цвет меняется по времени дня.', 'Стеклянный Chemex: кофе ровно до фирменной линии. Буква K — это он.', 'Базовая линейка, средняя обжарка. Высота цветной части — степень обжарки.', 'Четыре буквы, одна линия: 3D-логотип как настольная скульптура со светящейся линией.'] },
};
const mv = document.getElementById('mv');
const tabs = document.getElementById('tabs');
const sw = document.getElementById('sw');
let current = 0, sleeveIdx = 0, L;

function renderTabs() {
  if (!L) return;
  tabs.innerHTML = '';
  MODELS.forEach((m, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.role = 'tab'; b.textContent = L.t.names[i];
    b.setAttribute('aria-selected', i === current ? 'true' : 'false');
    b.addEventListener('click', () => select(i));
    tabs.appendChild(b);
  });
  document.getElementById('desc').textContent = L.t.desc[current];
  mv.alt = 'MOKA ' + L.t.names[current];
}
function select(i) {
  current = i;
  mv.src = `../models/${MODELS[i].id}.glb`;
  mv.cameraOrbit = MODELS[i].orbit;
  document.getElementById('sleeve').classList.toggle('hidden', i !== 0);
  document.getElementById('hot').classList.toggle('hidden', i !== 0);
  renderTabs();
}
async function applySleeve() {
  document.getElementById('swname').textContent = DAY[sleeveIdx].name;
  sw.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', i === sleeveIdx ? 'true' : 'false'));
  if (current !== 0 || !mv.model) return;
  const mat = mv.model.getMaterialByName('Sleeve');
  if (!mat) return;
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  paintSleeve(c, DAY[sleeveIdx]);
  // glTF textures are not flipped like three.js canvas textures: flip the art vertically.
  const f = document.createElement('canvas'); f.width = c.width; f.height = c.height;
  const fg = f.getContext('2d'); fg.translate(0, f.height); fg.scale(1, -1); fg.drawImage(c, 0, 0);
  const tex = await mv.createTexture(f.toDataURL('image/png'));
  mat.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
}
DAY.forEach((d, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.style.background = d.bg; b.setAttribute('aria-label', d.name);
  b.addEventListener('click', () => { sleeveIdx = i; applySleeve(); });
  sw.appendChild(b);
});
mv.addEventListener('load', () => { if (current === 0 && sleeveIdx !== 0) applySleeve(); });
mv.addEventListener('ar-status', (e) => { if (e.detail.status === 'failed') document.getElementById('noar').classList.remove('hidden'); });
L = initLang(T, { home: '../../', onChange: () => renderTabs() });
renderTabs();
// default sleeve: the colour of the current time of day in Baku
const h = new Date().getHours();
sleeveIdx = h < 11 ? 1 : h < 16 ? 2 : h < 20 ? 3 : 4;
select(0);
applySleeve();
// Hide the AR button where AR can't run (desktop) — the QR code is shown instead.
customElements.whenDefined('model-viewer').then(() => setTimeout(() => { if (!mv.canActivateAR) document.querySelector('.arbtn').classList.add('hidden'); }, 800));
</script>
</body>
</html>
