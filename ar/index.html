<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOKA AR</title>
<meta name="description" content="MOKA Coffee Roastery WebAR: kartı skan et, stəkanı masana qoy, qəhvə selfisi çək. Tətbiq lazım deyil.">
<meta name="theme-color" content="#1B1714">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500&family=Montserrat:wght@500&family=Mulish:wght@400;700&display=swap">
<link rel="stylesheet" href="./shared/ui.css">
<style>
  body{min-height:100svh}
  .wrap{max-width:1100px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px))}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  header.hero{display:grid;gap:18px;margin:48px 0 36px}
  header.hero .wm{width:150px}
  header.hero .line{height:4px;background:var(--paper);max-width:520px}
  header.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.04;max-width:16ch}
  header.hero p{margin:0;color:var(--muted);line-height:1.6;max-width:56ch;font-size:17px}
  .grid{display:grid;gap:14px;grid-template-columns:1fr}
  @media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
  .xp{position:relative;display:flex;flex-direction:column;gap:12px;padding:22px;border:1.5px solid rgba(245,241,234,.15);text-decoration:none;min-height:300px;overflow:hidden;transition:border-color .3s,transform .5s cubic-bezier(.2,.8,.2,1)}
  .xp:hover{border-color:var(--glow);transform:translateY(-4px)}
  .xp .num{font-family:var(--display);font-size:56px;line-height:1;color:rgba(245,241,234,.12);position:absolute;right:16px;top:12px}
  .xp .ic{width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .xp h2{font-size:26px;line-height:1.1}
  .xp p{margin:0;color:var(--muted);line-height:1.55;font-size:15px;flex:1}
  .xp .go{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
  .xp .tag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--esp);background:var(--glow);padding:4px 8px;align-self:flex-start}
  .xp.c1{background:linear-gradient(160deg,rgba(200,155,109,.16),transparent 60%)}
  .xp.c2{background:linear-gradient(160deg,rgba(217,181,106,.16),transparent 60%)}
  .xp.c3{background:linear-gradient(160deg,rgba(168,100,58,.2),transparent 60%)}
  .how{margin-top:40px;display:grid;gap:12px;color:var(--muted);font-size:14px;line-height:1.6;border-top:1.5px solid rgba(245,241,234,.15);padding-top:20px}
  .how b{color:var(--paper)}
  .clubline{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;border:1.5px solid rgba(255,226,166,.4);padding:14px 18px;text-decoration:none;color:var(--paper);font-size:15px}
  .clubline b{font-family:var(--display);font-size:28px;color:var(--glow)}
  .qr{display:flex;gap:16px;align-items:center}
  .qr img{width:96px;height:96px;background:#fff;padding:6px}
  @media(max-width:759px){.qr{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="back" data-home href="../"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-t="back">Sayta qayıt</span></a>
    <div class="langs" role="group" aria-label="Language"><button type="button" data-lang="az">AZ</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button></div>
  </div>
  <header class="hero">
    <span id="wm"></span>
    <div class="line"></div>
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
  </header>
  <div class="grid">
    <a class="xp c1" data-hub="./card/" href="./card/">
      <span class="num">01</span>
      <span class="ic" style="background:var(--oak)"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><rect x="5" y="9" width="30" height="22" fill="none" stroke="#1B1714" stroke-width="3"/><path d="M5 15V9h6M35 15V9h-6M5 25v6h6M35 25v6h-6" fill="none" stroke="#1B1714" stroke-width="3"/></svg></span>
      <h2 data-t="c1t"></h2>
      <p data-t="c1p"></p>
      <span class="go"><span data-t="open"></span> →</span>
    </a>
    <a class="xp c2" data-hub="./table/" href="./table/">
      <span class="num">02</span>
      <span class="ic" style="background:var(--bamboo)"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><path d="M13 10h14l-2 20H15z" fill="#1B1714"/><path d="M4 32h32" stroke="#1B1714" stroke-width="3"/></svg></span>
      <span class="tag" data-t="new"></span>
      <h2 data-t="c2t"></h2>
      <p data-t="c2p"></p>
      <span class="go"><span data-t="open"></span> →</span>
    </a>
    <a class="xp c3" data-hub="./selfie/" href="./selfie/">
      <span class="num">03</span>
      <span class="ic" style="background:var(--copper)"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><circle cx="20" cy="18" r="10" fill="none" stroke="#1B1714" stroke-width="3"/><path d="M12 26c3 3 13 3 16 0" stroke="#1B1714" stroke-width="3" fill="none"/><path d="M8 15h24" stroke="#F5F1EA" stroke-width="2.5"/></svg></span>
      <span class="tag" data-t="new"></span>
      <h2 data-t="c3t"></h2>
      <p data-t="c3p"></p>
      <span class="go"><span data-t="open"></span> →</span>
    </a>
  </div>
  <a class="clubline" data-hub="../club/" href="../club/"><span class="eyebrow" style="margin:0">MOKA Club</span><span data-t="club"></span><b id="pts">0</b></a>
  <div class="how">
    <p><b data-t="howT"></b> <span data-t="how"></span></p>
    <div class="qr"><img src="./qr.png" alt="" id="qr" width="96" height="96"><span data-t="qr"></span></div>
    <small data-t="note"></small>
  </div>
</div>
<script src="../club/club.js"></script>
<script type="module">
import { initLang, WORDMARK_SVG } from './shared/lang.js';
document.getElementById('wm').innerHTML = WORDMARK_SVG;
const T = {
  az: { back: 'Sayta qayıt', eyebrow: 'WebAR · tətbiq yükləmədən', title: 'MOKA telefonunun kamerasında', lead: 'Üç təcrübə, hamısı brauzerdə işləyir. Kartı skan edib qəhvənin tökülməsinə bax, stəkanı və paketi öz masana qoy, ya da MOKA filtrində qəhvə selfisi çək.',
    c1t: 'Kartı skan et', c1p: 'Kameranı AR kartına və ya stəkan qoluna tut: dörd hərf kartdan qalxır, Chemex peyda olur və qəhvə imza xəttinə qədər dolur.',
    c2t: 'Masana qoy', c2p: 'Stəkanı, Chemex-i, paketi və 3D loqonu real ölçüdə masana yerləşdir. Qolun rəngini günün saatına görə dəyiş.',
    c3t: 'Qəhvə selfisi', c3p: 'Ön kamera ilə üç MOKA filtri: köpük bığ, imza xətti və hərflərdən tac. Şəkil çək və paylaş.',
    open: 'Aç', new: 'Yeni', club: 'Hər AR təcrübəsi +25 xal verir. Xal topla, endirim kodu qazan →', howT: 'Necə işləyir?', how: 'Kamera icazəsi lazımdır. iPhone-da Safari, Android-də Chrome tövsiyə olunur. "Masana qoy" iPhone-da Quick Look, Android-də Scene Viewer ilə açılır.',
    qr: 'Kompüterdəsən? QR kodu telefonla skan et.', note: 'Konsept / test işi. MOKA Coffee Roastery-nin rəsmi tətbiqi deyil.' },
  en: { back: 'Back to site', eyebrow: 'WebAR · no app needed', title: 'MOKA in your phone camera', lead: 'Three experiences, all in the browser. Scan the card and watch the coffee pour, put the cup and the bag on your own table, or take a coffee selfie with a MOKA filter.',
    c1t: 'Scan the card', c1p: 'Point the camera at the AR card or the cup sleeve: four letters rise from the card, a Chemex appears and fills to the signature line.',
    c2t: 'On your table', c2p: 'Place the cup, the Chemex, the bag and the 3D logo on your table at real size. Change the sleeve colour by the time of day.',
    c3t: 'Coffee selfie', c3p: 'Three MOKA filters for the front camera: a foam moustache, the signature line and a crown of letters. Take a photo and share it.',
    open: 'Open', new: 'New', club: 'Each AR experience earns +25 points. Collect points, earn a discount code →', howT: 'How it works:', how: 'Camera access is needed. Use Safari on iPhone and Chrome on Android. "On your table" opens in Quick Look on iPhone and Scene Viewer on Android.',
    qr: 'On a computer? Scan the QR code with your phone.', note: 'Concept / test project. Not an official MOKA Coffee Roastery app.' },
  ru: { back: 'На сайт', eyebrow: 'WebAR · без приложения', title: 'MOKA в камере телефона', lead: 'Три сценария, всё в браузере. Наведите камеру на карточку и смотрите, как наливается кофе, поставьте стакан и пачку на свой стол или сделайте кофейное селфи с фильтром MOKA.',
    c1t: 'Сканируйте карточку', c1p: 'Наведите камеру на AR-карточку или манжету стакана: четыре буквы поднимаются с карточки, появляется Chemex и наполняется до фирменной линии.',
    c2t: 'На вашем столе', c2p: 'Поставьте стакан, Chemex, пачку и 3D-логотип на стол в натуральную величину. Меняйте цвет манжеты по времени дня.',
    c3t: 'Кофейное селфи', c3p: 'Три фильтра MOKA для фронтальной камеры: усы из пенки, фирменная линия и корона из букв. Сделайте фото и поделитесь.',
    open: 'Открыть', new: 'Новое', club: 'Каждый AR-сценарий даёт +25 баллов. Копите баллы, получайте код скидки →', howT: 'Как это работает:', how: 'Нужен доступ к камере. На iPhone — Safari, на Android — Chrome. «На вашем столе» открывается в Quick Look на iPhone и в Scene Viewer на Android.',
    qr: 'Вы за компьютером? Отсканируйте QR-код телефоном.', note: 'Концепт / тестовый проект. Не официальное приложение MOKA Coffee Roastery.' },
};
initLang(T, { home: '../' });
if (window.MokaClub) document.getElementById('pts').textContent = MokaClub.state().points;
</script>
</body>
</html>
