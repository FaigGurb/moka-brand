<!doctype html>
<!-- MOKA logo animation, rendered frame by frame (deterministic render(t)).
     Used by docs/tools/render_logo_video.py; also viewable live in a browser (serve repo root). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>html,body{margin:0;background:#1B1714}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { LETTERS, HANDLE_PATH, halves } from '../../ar/shared/moka-art.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1080);
const TAG = q.get('tag') || '4 hərf · 4 dəmləmə · 1 xətt';
const c = document.getElementById('c'); c.width = W; c.height = H;
const g = c.getContext('2d');
const ease = (x) => { x = Math.min(1, Math.max(0, x)); return 1 - Math.pow(1 - x, 3); };          // settle
const easeIn = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * x; };                    // pour
const back = (x) => { x = Math.min(1, Math.max(0, x)); const s = 1.4; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
function poly(p) { g.beginPath(); p.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill(); }
window.render = (t) => {
  g.fillStyle = '#1B1714'; g.fillRect(0, 0, W, H);
  // warm wash
  const grd = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.6);
  grd.addColorStop(0, `rgba(242,199,110,${0.16 * ease(t / 1.2)})`); grd.addColorStop(1, 'rgba(242,199,110,0)');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  const markW = W * 0.72, s = markW / 675, x0 = (W - markW) / 2, cy = H * 0.47, y0 = cy - 77 * s;
  // 1) the line draws (0 – 0.7s)
  const lp = ease(t / 0.7);
  const glow = 0.6 + 0.4 * Math.max(0, 1 - Math.abs(t - 1.35) / 0.35);
  g.save(); g.shadowColor = '#FFE2A6'; g.shadowBlur = 30 * glow * s * 4;
  g.fillStyle = `rgba(255,226,166,${glow})`;
  g.fillRect(x0 - 40 * s, cy - 1.6 * s, (markW + 80 * s) * lp, 3.2 * s); g.restore();
  // 2) halves arrive and close on the line, letter by letter (0.45 – 1.35s)
  g.save(); g.translate(x0, y0); g.scale(s, s); g.fillStyle = '#F5F1EA'; g.strokeStyle = '#F5F1EA';
  LETTERS.forEach((l, i) => {
    const k = back((t - 0.45 - i * 0.1) / 0.6);
    const a = Math.min(1, Math.max(0, (t - 0.45 - i * 0.1) / 0.2));
    if (a <= 0) return;
    g.globalAlpha = a;
    const h = halves(l.poly), off = (1 - k) * 60;
    g.save(); g.translate(0, -off); poly(h.top);
    if (l.id === 'K') { g.lineWidth = 8; g.stroke(new Path2D(HANDLE_PATH)); }
    g.restore();
    g.save(); g.translate(0, off); poly(h.bottom); g.restore();
  });
  g.restore(); g.globalAlpha = 1;
  // 3) tagline (1.7 – 2.3s)
  const ta = ease((t - 1.7) / 0.6);
  if (ta > 0) {
    g.globalAlpha = ta; g.fillStyle = '#C89B6D';
    g.font = `700 ${Math.round(W * 0.026)}px Mulish, Montserrat, sans-serif`;
    g.letterSpacing = `${Math.round(W * 0.006)}px`;
    g.textAlign = 'center'; g.fillText(TAG.toUpperCase(), W / 2, cy + 130 * s + (1 - ta) * 12);
    g.globalAlpha = 1;
  }
};
await document.fonts.load(`700 30px Mulish`);
window.ready = true;
if (!q.get('static')) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % 3.4); requestAnimationFrame(loop); }; loop(); }
</script></body></html>
